spring:
  application:
    name: testnav-yrkesskade-proxy
    description: Proxy for yrkesskade som legger på TokenX sikkerhet ...
  config:
    import: "dolly-application.yml"
  security:
    oauth2:
      resourceserver:
        aad:
          issuer-uri: ${AZURE_OPENID_CONFIG_ISSUER}
        tokenx:
          issuer-uri: ${TOKEN_X_ISSUER}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            response-timeout: 30s
            wiretap: true

logging:
  level:
    reactor:
      netty: INFO
    org:
      springframework:
        cloud:
          gateway: INFO

consumers:
  fakedings:
    url: https://fakedings.intern.dev.nav.no
    cluster: dev-gcp
    namespace: nais
    name: fakedings
  yrkesskade:
    url: http://yrkesskade-datagenerator-service.yrkesskade.svc.cluster.local
    cluster: dev-gcp
    name: yrkesskade-datagenerator-service
    namespace: yrkesskade