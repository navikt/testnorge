apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: testnav-template-search-service-dev
  namespace: dolly
  labels:
    team: dolly
spec:
  image: "{{image}}"
  port: 8080
  azure:
    application:
      allowAllUsers: true
      enabled: true
      tenant: nav.no
  accessPolicy:
    inbound:
      rules:
        - application: dolly-frontend-dev
        - application: dolly-auth-local
        - application: team-dolly-lokal-app
    outbound:
      rules:
        - application: dolly-backend-dev
        - application: logging
          namespace: nais-system
  liveness:
    path: /internal/health/liveness
    initialDelay: 20
    periodSeconds: 10
    failureThreshold: 20
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  readiness:
    path: /internal/health/readiness
    initialDelay: 20
    periodSeconds: 10
    failureThreshold: 20
  prometheus:
    enabled: true
    path: /internal/metrics
  gcp:
    sqlInstances:
      - type: POSTGRES_15
        tier: db-f1-micro
        diskSize: 10
        diskType: HDD
        diskAutoresize: false
        highAvailability: false
        name: testnav-template-search-service-dev
        databases:
          - name: testnav-template-search-service-dev-db
  replicas:
    min: 1
    max: 1
  resources:
    requests:
      cpu: 20m
      memory: 800Mi
    limits:
      memory: 2048Mi
  ingresses:
    - "https://testnav-template-search-service-dev.intern.dev.nav.no"
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: dev
