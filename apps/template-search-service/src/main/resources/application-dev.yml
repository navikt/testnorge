    username: ${NAIS_DATABASE_TESTNAV_TEMPLATE_SEARCH_SERVICE_DEV_TESTNAV_TEMPLATE_SEARCH_SERVICE_DEV_DB_USERNAME}
    password: ${NAIS_DATABASE_TESTNAV_TEMPLATE_SEARCH_SERVICE_DEV_TESTNAV_TEMPLATE_SEARCH_SERVICE_DEV_DB_PASSWORD}
    properties:
      sslCert: ${NAIS_DATABASE_TESTNAV_TEMPLATE_SEARCH_SERVICE_DEV_TESTNAV_TEMPLATE_SEARCH_SERVICE_DEV_DB_SSLCERT}
