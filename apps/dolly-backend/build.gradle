plugins {
    id "dolly-apps"
}

sonarqube {
    properties {
        property "sonar.projectKey", "testnav-dolly-backend"
        property "sonar.projectName", "testnav-dolly-backend"
    }
}

test {
    jvmArgs = ["--add-opens", "java.base/java.lang=ALL-UNNAMED"]
    maxHeapSize = "1g"
}

dependencies {
    implementation "no.nav.testnav.libs:data-transfer-objects"
    implementation "no.nav.testnav.libs:reactive-core"
    implementation "no.nav.testnav.libs:reactive-security"
    implementation "no.nav.testnav.libs:security-core"
    implementation "no.nav.testnav.libs:reactive-standalone-security"
    implementation "no.nav.testnav.libs:testing"

    implementation "org.aspectj:aspectjweaver:$versions.jweaver"
    implementation "org.aspectj:aspectjrt:$versions.jweaver"

    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:$versions.springdoc"
    implementation "io.swagger.core.v3:swagger-annotations-jakarta:$versions.swagger"

    implementation "org.springframework.boot:spring-boot-starter-data-r2dbc"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-client"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation "org.springframework.retry:spring-retry"
    implementation "org.springframework.boot:spring-boot-flyway"

    implementation "org.opensearch.client:opensearch-java:$versions.opensearchClient"
    implementation "org.apache.httpcomponents.client5:httpclient5"

    implementation "org.apache.commons:commons-lang3"
    implementation "org.springframework.boot:spring-boot-starter-cache"
    implementation "com.github.ben-manes.caffeine:caffeine"

    implementation "org.ehcache:ehcache"
    implementation "com.fasterxml.jackson.core:jackson-core"
    implementation "tools.jackson.core:jackson-databind"

    runtimeOnly "org.postgresql:r2dbc-postgresql"
    runtimeOnly "io.r2dbc:r2dbc-pool"

    runtimeOnly "org.postgresql:postgresql"
    implementation "org.flywaydb:flyway-core"
    implementation "org.flywaydb:flyway-database-postgresql"

    implementation "ma.glasnost.orika:orika-core:$versions.orika"
    implementation "org.codehaus.jettison:jettison:1.5.7"
    implementation "org.apache.poi:poi:$versions.apachePoi"
    implementation "org.apache.poi:poi-ooxml:$versions.apachePoi"

    testImplementation "io.projectreactor:reactor-test:$versions.reactorTest"
    testImplementation "org.opensearch:opensearch-testcontainers:4.1.0"
    testImplementation "org.springframework.boot:spring-boot-starter-data-r2dbc"
    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-postgresql"

    testImplementation "org.wiremock:wiremock-standalone:$versions.wiremock"

    implementation "net.java.dev.jna:jna:5.19.1"
}