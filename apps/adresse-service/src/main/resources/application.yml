spring:
  application:
    name: adresse-service
  config:
    import: "classpath:dolly-application.yml"
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        aad:
          issuer-uri: ${AZURE_OPENID_CONFIG_ISSUER}
        tokenx:
          issuer-uri: ${TOKEN_X_ISSUER}

opensearch:
  index:
    adresser: pdl-adresse
    
springdoc:
  swagger-ui:
    path: /swagger