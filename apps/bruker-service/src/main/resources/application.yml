spring:
  application:
    name: testnav-bruker-service
    description: Tjeneste for brukere
  config:
    import: "classpath:dolly-application.yml"
  security:
    oauth2:
      resourceserver:
        aad:
          issuer-uri: ${AZURE_OPENID_CONFIG_ISSUER}
          accepted-audience: ${AZURE_APP_CLIENT_ID}, api://${AZURE_APP_CLIENT_ID}
        tokenx:
          accepted-audience: ${TOKEN_X_CLIENT_ID}

consumers:
  dolly-backend:
    url: http://dolly-backend.dolly.svc.cluster.local
    cluster: dev-gcp
    namespace: dolly
    name: dolly-backend
  dolly-backend-dev:
    url: http://dolly-backend-dev.dolly.svc.cluster.local
    cluster: dev-gcp
    namespace: dolly
    name: dolly-backend-dev
  testnav-altinn3-tilgang-service:
    url: http://testnav-altinn3-tilgang-proxy.dolly.svc.cluster.local
    cluster: dev-gcp
    namespace: dolly
    name: testnav-altinn3-tilgang-proxy