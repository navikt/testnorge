consumers:
  testnav-dolly-proxy:
    cluster: dev-fss
    name: testnav-dolly-proxy
    namespace: dolly
    url: https://testnav-dolly-proxy.dev-fss-pub.nais.io

spring:
  application:
    name: testnav-joark-dokument-service
    description: App for å hente ut joark dokumenter.
  config:
    import: "dolly-application.yml"
  security:
    oauth2:
      resourceserver:
        aad:
          issuer-uri: ${AZURE_OPENID_CONFIG_ISSUER}
        tokenx:
          issuer-uri: ${TOKEN_X_ISSUER}
