apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: testnav-dollystatus
  namespace: dolly
  labels:
    team: dolly
spec:
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
  image: "{{image}}"
  port: 8080
  azure:
    sidecar:
      enabled: true
      autoLogin: true
    application:
      allowAllUsers: true
      enabled: true
      tenant: nav.no
  accessPolicy:
    outbound:
      rules:
        - application: dolly-backend
        - application: dolly-backend-dev
        - application: testnav-arbeidssoekerregisteret-proxy
        - application: testnav-arbeidsplassencv-proxy
        - application: testnav-nom-proxy
        - application: testnav-organisasjon-forvalter
        - application: testnav-pdl-forvalter
        - application: testnav-budpro-service
        - application: testnav-tps-messaging-service
        - application: logging
          namespace: nais-system
      external:
        - host: login.microsoftonline.com
        - host: slack.com
        - host: testnav-dolly-proxy.dev-fss-pub.nais.io
        - host: testnav-pdl-proxy.dev-fss-pub.nais.io
  liveness:
    path: /internal/health/liveness
    initialDelay: 20
    periodSeconds: 10
    failureThreshold: 20
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  readiness:
    path: /internal/health/readiness
    initialDelay: 20
    periodSeconds: 10
    failureThreshold: 20
  prometheus:
    enabled: true
    path: /internal/metrics
  replicas:
    min: 1
    max: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2048Mi
  envFrom:
    - secret: dollystatus-slack-secret
  ingresses:
    - "https://dollystatus.intern.dev.nav.no"
