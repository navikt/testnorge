plugins {
    id "dolly-apps"

    id "uk.co.boothen.gradle.wsimport" version "0.25"
}

sonarqube {
    properties {
        property "sonar.projectKey", "brreg-stub"
        property "sonar.projectName", "brreg-stub"
    }
}

wsimport {
    wsdl("Grunndata.wsdl") {
        packageName("no.nav.brregstub.tjenestekontrakter.ws")
    }
}

dependencies {

    runtimeOnly 'org.jetbrains.kotlin:kotlin-reflect'

    implementation("io.dropwizard:dropwizard-jackson:4.0.13") {
        exclude group: "com.google.code.findbugs"
    }

    implementation "no.nav.testnav.libs:servlet-core"
    implementation("no.nav.testnav.libs:testing") {
        exclude group: "org.springframework.boot", module: "spring-boot-webtestclient"
        exclude group: "org.springframework", module: "spring-webflux"
        exclude group: "org.springframework", module: "spring-web-reactive"
        exclude group: "io.projectreactor", module: "reactor-core"
        exclude group: "io.projectreactor.netty", module: "reactor-netty"
        exclude group: "io.projectreactor.netty", module: "reactor-netty-http"
    }
    implementation "no.nav.testnav.libs:vault"

    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-web-services"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"

    implementation "org.springframework.cloud:spring-cloud-vault-config-databases"
    implementation "org.springframework.boot:spring-boot-starter-validation"

    implementation "jakarta.servlet:jakarta.servlet-api"

    implementation "org.postgresql:postgresql"
    implementation "com.zaxxer:HikariCP"

    implementation "org.springframework.boot:spring-boot-flyway"
    implementation "org.flywaydb:flyway-core"
    implementation "org.flywaydb:flyway-database-postgresql"

    implementation "wsdl4j:wsdl4j"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:$versions.springdoc"
    implementation "io.swagger.core.v3:swagger-annotations-jakarta:$versions.swagger"

    implementation "com.sun.xml.ws:jaxws-rt:$versions.jaxws"
    implementation "jakarta.jws:jakarta.jws-api:3.0.0"
    implementation "io.grpc:grpc-netty-shaded"

    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-postgresql"
    testImplementation "org.wiremock:wiremock-standalone:$versions.wiremock"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-test-autoconfigure"
    testImplementation "org.springframework.boot:spring-boot-webmvc-test"
    testImplementation "org.springframework.boot:spring-boot-resttestclient"

    testImplementation "org.apache.cxf:cxf-rt-bindings-soap"
    testImplementation "org.apache.cxf:cxf-rt-ws-policy"
    testImplementation "org.apache.cxf:cxf-core"
    testImplementation "org.apache.cxf:cxf-rt-frontend-jaxws"
    testImplementation "org.apache.cxf:cxf-rt-transports-http"
    testImplementation "org.apache.cxf:cxf-rt-ws-security"
    testImplementation "no.nav.common:auth:3.2026.04.08_08.37-229807cc181a"
    testImplementation "no.nav.common:util:3.2026.04.08_08.37-229807cc181a"
    testImplementation "no.nav.common:cxf:3.2026.04.08_08.37-229807cc181a"

}
