spring:
  application:
    name: testnav-organisasjon-service
    description: "Testnorge organisasjoner API"
  main:
    web-application-type: reactive
  config:
    import: "dolly-application.yml"
  security:
    oauth2:
      resourceserver:
        aad:
          issuer-uri: ${AZURE_OPENID_CONFIG_ISSUER}
        tokenx:
          issuer-uri: ${TOKEN_X_ISSUER}
consumers:
  testnav-dolly-proxy:
    cluster: dev-fss
    name: testnav-dolly-proxy
    namespace: dolly
    url: https://testnav-dolly-proxy.dev-fss-pub.nais.io