spring:
  application:
    name: testnav-organisasjon-mottak-service
    description: Lytter på Kafka og sender organisasjoner til ereg via ereg-dolly-enheter-integrasjon.
  main:
    web-application-type: reactive
  config:
    import: "dolly-application.yml"

consumers:
  testnav-dolly-proxy:
    name: testnav-dolly-proxy
    namespace: dolly
    url: https://testnav-dolly-proxy.dev-fss-pub.nais.io
    cluster: dev-fss

kafka.groupid: testnav-organisasjon-mottak-service-v1